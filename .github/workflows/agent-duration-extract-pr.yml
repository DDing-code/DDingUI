name: Agent Duration Extraction PR

on:
  pull_request:
    branches:
      - agent/aura-fallback-driver

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'agent/aura-duration-driver'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aura-duration-driver
          fetch-depth: 0
      - name: Patch extraction helper for assigned duration value
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/agent_duration_extract.py')
          text = path.read_text(encoding='utf-8')
          old = '''text, duration_replacements = duration_pattern.subn(duration_repl, text)
          assert duration_replacements == 8, f'GetAuraDuration replacements: expected 8, got {duration_replacements}'
          text = text.replace('-- Duration 모드: C_UnitAuras.GetAuraDuration 사용', '-- Duration 모드: legacy duration driver 사용')
          '''
          new = '''text, duration_replacements = duration_pattern.subn(duration_repl, text)
          assert duration_replacements == 7, f'GetAuraDuration local replacements: expected 7, got {duration_replacements}'

          assigned_duration_pattern = re.compile(
              r'(?P<indent>[ \\t]*)local durObj = C_UnitAuras\\.GetAuraDuration\\((?P<args>[^\\n]+)\\)\\n'
              r'(?P=indent)if durObj then\\n'
              r'(?P=indent)    (?P<var>[A-Za-z_][A-Za-z0-9_]*) = durObj:GetRemainingDuration\\(\\)'
          )

          def assigned_duration_repl(match):
              indent = match.group('indent')
              args = match.group('args')
              var = match.group('var')
              return (
                  f'{indent}{var} = LegacyDurationDriver.GetRemainingDuration({args})\\n'
                  f'{indent}if {var} ~= nil then'
              )

          text, assigned_duration_replacements = assigned_duration_pattern.subn(assigned_duration_repl, text)
          assert assigned_duration_replacements == 1, (
              f'GetAuraDuration assigned replacements: expected 1, got {assigned_duration_replacements}'
          )
          text = text.replace('-- Duration 모드: C_UnitAuras.GetAuraDuration 사용', '-- Duration 모드: legacy duration driver 사용')
          '''
          if old not in text:
              raise SystemExit('duration replacement marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Apply extraction
        run: python tools/agent_duration_extract.py
      - name: Validate syntax and boundary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/ResourceBars/TrackedAuraLegacyDurationDriver.lua"))'
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/ResourceBars/BuffTrackerBar.lua"))'
          git diff --check
          test "$(grep -c 'C_UnitAuras.GetAuraDuration' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true)" -eq 0
          test "$(grep -c 'GetCooldownTimes' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true)" -eq 0
          test "$(grep -c 'GetAuraDataByAuraInstanceID' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true)" -eq 3
          ! grep -q 'resolver:MirrorProgress' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DDingUI/Modules/ResourceBars/BuffTrackerBar.lua
          if ! git diff --cached --quiet; then
            git commit -m "refactor(custom-aura): extract legacy duration reads"
            git push origin HEAD:agent/aura-duration-driver
          fi
