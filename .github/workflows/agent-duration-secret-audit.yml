name: Agent Duration Secret Audit

on:
  pull_request:
    branches:
      - agent/aura-fallback-driver

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/aura-duration-driver'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aura-duration-driver
      - name: Audit secret duration uses
        run: |
          echo '=== GetRemainingDuration callsites ==='
          grep -n -C 3 'LegacyDurationDriver.GetRemainingDuration' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true
          echo '=== direct nil comparisons ==='
          grep -n -E '(remaining|secretRemaining|initialRemaining)[[:space:]]*([~=]=|and)' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true
          echo '=== driver helper ==='
          grep -n -C 2 'HasRemainingDurationValue' DDingUI/Modules/ResourceBars/TrackedAuraLegacyDurationDriver.lua || true
