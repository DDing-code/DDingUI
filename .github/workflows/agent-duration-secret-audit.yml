name: Agent Duration Secret Fix

on:
  pull_request:
    branches:
      - agent/aura-fallback-driver

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/aura-duration-driver' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aura-duration-driver
          fetch-depth: 0

      - name: Remove secret duration comparison
        shell: python
        run: |
          from pathlib import Path

          path = Path('DDingUI/Modules/ResourceBars/BuffTrackerBar.lua')
          text = path.read_text(encoding='utf-8')
          old = '''        if durationWarningEnabled and hasData then
              local initialRemaining = nil
              pcall(function()
                  if HasAuraInstanceID(auraInstanceID) then
                      initialRemaining = LegacyDurationDriver.GetRemainingDuration(unit, auraInstanceID)
                      if LegacyDurationDriver.HasRemainingDurationValue(initialRemaining) then
                      end
                  elseif isManualMode and manualExpiresAt then
                      initialRemaining = manualExpiresAt - GetTime()
                  end
              end)
              if initialRemaining and initialRemaining <= durationWarningThreshold then
                  initialColor = durationWarningColor
              end
          end
          '''
          new = '''        if durationWarningEnabled and hasData then
              local initialRemaining = nil
              pcall(function()
                  if HasAuraInstanceID(auraInstanceID) then
                      initialRemaining = LegacyDurationDriver.GetRemainingDuration(unit, auraInstanceID)
                  elseif isManualMode and manualExpiresAt then
                      initialRemaining = manualExpiresAt - GetTime()
                  end
              end)
              -- Protected remaining-duration values may be forwarded to Blizzard
              -- display sinks, but must never be compared in Lua.
              if IsAccessibleNumber(initialRemaining)
                  and initialRemaining <= durationWarningThreshold
              then
                  initialColor = durationWarningColor
              end
          end
          '''
          if text.count(old) != 1:
              raise SystemExit(f'warning block marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate secret-safe duration boundary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/ResourceBars/TrackedAuraLegacyDurationDriver.lua"))'
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/ResourceBars/BuffTrackerBar.lua"))'
          git diff --check
          test "$(grep -c 'C_UnitAuras.GetAuraDuration' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true)" -eq 0
          test "$(grep -c 'GetCooldownTimes' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true)" -eq 0
          test "$(grep -c 'GetAuraDataByAuraInstanceID' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true)" -eq 3
          test "$(grep -c 'LegacyDurationDriver.GetRemainingDuration' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true)" -eq 8
          ! grep -q 'initialRemaining and initialRemaining' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua
          grep -q 'IsAccessibleNumber(initialRemaining)' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua
          ! grep -q 'resolver:MirrorProgress' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DDingUI/Modules/ResourceBars/BuffTrackerBar.lua
          if ! git diff --cached --quiet; then
            git commit -m "fix(custom-aura): avoid secret duration comparison"
            git push origin HEAD:agent/aura-duration-driver
          fi
