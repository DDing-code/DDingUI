name: Agent Aura API Boundary

on:
  pull_request:
    branches:
      - agent/aura-duration-driver

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.ref == 'agent/aura-api-boundary' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aura-api-boundary
          fetch-depth: 0

      - name: Move direct aura API access behind fallback drivers
        run: python tools/agent_aura_api_boundary.py

      - name: Validate Lua and API boundary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/ResourceBars/TrackedAuraLegacyFallbackDriver.lua"))'
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/ResourceBars/TrackedAuraLegacyDurationDriver.lua"))'
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/ResourceBars/BuffTrackerBar.lua"))'
          git diff --check
          test "$(grep -c 'C_UnitAuras\.' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true)" -eq 0
          test "$(grep -c 'local C_UnitAuras' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true)" -eq 0
          test "$(grep -c 'GetAuraDataByAuraInstanceID' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua || true)" -eq 0
          ! grep -q 'local function GetBuffData' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua
          grep -q 'LegacyAuraDriver.GetAuraDataAutoUnit' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua
          grep -q 'LegacyDurationDriver.ReadTiming' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua
          grep -q 'function Driver.GetAuraDataByInstance' DDingUI/Modules/ResourceBars/TrackedAuraLegacyFallbackDriver.lua
          grep -q 'return duration, expirationTime, remaining, protected' DDingUI/Modules/ResourceBars/TrackedAuraLegacyDurationDriver.lua

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DDingUI/Modules/ResourceBars/TrackedAuraLegacyFallbackDriver.lua \
                  DDingUI/Modules/ResourceBars/TrackedAuraLegacyDurationDriver.lua \
                  DDingUI/Modules/ResourceBars/BuffTrackerBar.lua
          if ! git diff --cached --quiet; then
            git commit -m "refactor(custom-aura): isolate direct aura API access"
            git push origin HEAD:agent/aura-api-boundary
          fi
