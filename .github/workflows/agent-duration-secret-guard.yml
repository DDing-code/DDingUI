name: Agent Duration Secret Guard

on:
  pull_request:
    branches:
      - agent/aura-fallback-driver

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'agent/aura-duration-driver'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aura-duration-driver
          fetch-depth: 0
      - name: Preserve secret duration passthrough
        shell: python
        run: |
          from pathlib import Path

          driver_path = Path('DDingUI/Modules/ResourceBars/TrackedAuraLegacyDurationDriver.lua')
          driver = driver_path.read_text(encoding='utf-8')
          marker = '''function Driver.GetTimeLeft(unit, auraInstanceID, now)
          '''
          helper = '''function Driver.HasRemainingDurationValue(value)
              if AuraDriver.IsSecretValue(value) then return true end
              return value ~= nil
          end

          function Driver.GetTimeLeft(unit, auraInstanceID, now)
          '''
          assert driver.count(marker) == 1, driver.count(marker)
          driver = driver.replace(marker, helper, 1)
          driver_path.write_text(driver, encoding='utf-8')

          bar_path = Path('DDingUI/Modules/ResourceBars/BuffTrackerBar.lua')
          bar = bar_path.read_text(encoding='utf-8')
          replacements = {
              'if remaining ~= nil then': 'if LegacyDurationDriver.HasRemainingDurationValue(remaining) then',
              'if secretRemaining ~= nil then': 'if LegacyDurationDriver.HasRemainingDurationValue(secretRemaining) then',
              'if initialRemaining ~= nil then': 'if LegacyDurationDriver.HasRemainingDurationValue(initialRemaining) then',
          }
          changed = 0
          for old, new in replacements.items():
              count = bar.count(old)
              changed += count
              bar = bar.replace(old, new)
          assert changed == 8, f'expected 8 duration guards, got {changed}'
          assert 'C_UnitAuras.GetAuraDuration' not in bar
          assert 'GetCooldownTimes' not in bar
          assert 'resolver:MirrorProgress' not in bar
          bar_path.write_text(bar, encoding='utf-8')

      - name: Validate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/ResourceBars/TrackedAuraLegacyDurationDriver.lua"))'
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/ResourceBars/BuffTrackerBar.lua"))'
          git diff --check
          grep -q 'HasRemainingDurationValue' DDingUI/Modules/ResourceBars/TrackedAuraLegacyDurationDriver.lua
          test "$(grep -c 'LegacyDurationDriver.HasRemainingDurationValue' DDingUI/Modules/ResourceBars/BuffTrackerBar.lua)" -eq 8

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DDingUI/Modules/ResourceBars/TrackedAuraLegacyDurationDriver.lua DDingUI/Modules/ResourceBars/BuffTrackerBar.lua
          git commit -m "fix(custom-aura): preserve secret duration passthrough"
          git push origin HEAD:agent/aura-duration-driver
