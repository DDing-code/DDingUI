name: Agent Group Frame Registry Clean Rebuild

on:
  pull_request:
    branches:
      - agent/aura-style-migration

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.ref == 'agent/group-frame-registry' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/group-frame-registry
          fetch-depth: 0

      - name: Fetch stacked base
        run: git fetch origin agent/aura-style-migration

      - name: Patch transformer marker matching
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/rebuild_group_frame_controller.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "hook_start = unique_index('-- [HOOK D] 뷰어별 Layout/Show/Hide', label='layout hook start')":
                  "hook_start = next(i for i, line in enumerate(lines) if '[HOOK D]' in body(line) and 'Layout/Show/Hide' in body(line))",
              "hook_end = unique_index('-- [CDM 패턴 C] Provisional Reparent', start=hook_start + 1, label='layout hook end')":
                  "hook_end = next(i for i in range(hook_start + 1, len(lines)) if 'Provisional Reparent' in body(lines[i]))",
              "        end_idx = unique_index(marker_first, start=start_idx + 1, label='edit marker')":
                  "        end_idx = start_idx + 1",
              "            if candidate + 1 < len(lines) and body(lines[candidate + 1]) == expected_next:":
                  "            if candidate + 1 < len(lines) and body(lines[candidate + 1]).startswith(expected_next):",
          }
          for old, new in replacements.items():
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Rebuild FrameController from exact base blob
        run: python .github/scripts/rebuild_group_frame_controller.py

      - name: Guard semantic diff size
        run: |
          python - <<'PY'
          import subprocess
          out = subprocess.check_output([
              'git', 'diff', '--numstat', 'origin/agent/aura-style-migration', '--',
              'DDingUI/Modules/GroupSystem/FrameController.lua'
          ], text=True).strip()
          assert out, 'FrameController has no changes'
          added, deleted, path = out.split('\t')
          added, deleted = int(added), int(deleted)
          print(f'FrameController semantic diff: +{added}/-{deleted}')
          assert added < 200, f'unexpectedly large additions: {added}'
          assert deleted < 250, f'unexpectedly large deletions: {deleted}'
          PY

      - name: Static hot-path checks
        run: |
          python - <<'PY'
          from pathlib import Path
          fc = Path('DDingUI/Modules/GroupSystem/FrameController.lua').read_text(encoding='utf-8')
          scan = fc[fc.index('function FrameController:ScanCDMViewers()'):fc.index('-- 하위 호환 별칭')]
          layout = fc[fc.index('Layout/Show/Hide'):fc.index('Provisional Reparent')]
          edit = fc[fc.index('function FrameController:EnableEditModeClicks()'):fc.index('function FrameController:ShowGroupAssignPopup(icon)')]
          assert ':EnumerateActive()' not in scan
          assert ':EnumerateActive()' not in layout
          assert ':EnumerateActive()' not in edit
          assert 'FrameRegistry:Refresh(viewerRefs)' in scan
          assert 'FrameRegistry:Acquire(viewer, frame)' in fc
          assert 'FrameRegistry:ReleaseFrame(frame, globalName)' in fc
          assert 'FrameRegistry:TrackFrame(itemFrame, safeCooldownID)' in fc
          assert 'SetFrameParentIfNeeded' in fc
          assert 'local function BuffFrameHasPlayerAura' not in fc
          toc = Path('DDingUI/DDingUI.toc').read_text(encoding='utf-8')
          assert toc.index('Modules\\GroupSystem\\CDMFrameRegistry.lua') < toc.index('Modules\\GroupSystem\\FrameController.lua')
          print('hot-path checks: ok')
          PY

      - name: Diff check
        run: git -c core.whitespace=cr-at-eol diff --check

      - name: Commit clean runtime
        run: |
          git checkout -- .github/scripts/rebuild_group_frame_controller.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DDingUI/Modules/GroupSystem/FrameController.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(group-system): clean registry integration diff"
          git push origin HEAD:agent/group-frame-registry
