name: Agent Group Frame Registry Final

on:
  pull_request:
    branches:
      - agent/aura-style-migration

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/group-frame-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/group-frame-registry
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Parse runtime
        run: |
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/GroupSystem/CDMFrameRegistry.lua"))'
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/GroupSystem/FrameController.lua"))'
          lua5.1 -e 'assert(loadfile("DDingUI/Modules/GroupSystem/GroupRenderer.lua"))'
          lua5.1 -e 'assert(loadfile("DDingUI/Core/CDMScanner.lua"))'

      - name: Static hot-path boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          fc = Path('DDingUI/Modules/GroupSystem/FrameController.lua').read_text(encoding='utf-8')
          scan = fc[fc.index('function FrameController:ScanCDMViewers()'):fc.index('-- 하위 호환 별칭')]
          layout = fc[fc.index('-- [HOOK D] 뷰어별 Layout/Show/Hide'):fc.index('-- [CDM 패턴 C] Provisional Reparent')]
          edit = fc[fc.index('function FrameController:EnableEditModeClicks()'):fc.index('-- ============================================================\n-- 그룹 선택 팝업')]
          assert ':EnumerateActive()' not in scan
          assert ':EnumerateActive()' not in layout
          assert ':EnumerateActive()' not in edit
          assert 'FrameRegistry:Refresh(viewerRefs)' in scan
          assert 'FrameRegistry:Acquire(viewer, frame)' in fc
          assert 'FrameRegistry:ReleaseFrame(frame, globalName)' in fc
          assert 'FrameRegistry:TrackFrame(itemFrame, safeCooldownID)' in fc
          assert 'local function BuffFrameHasPlayerAura' not in fc
          assert 'SetFrameParentIfNeeded' in fc
          assert 'frame:SetParent(UIParent)' not in fc
          assert 'self:SetParent(UIParent)' not in fc
          assert 'icon:SetParent(UIParent)' not in fc
          toc = Path('DDingUI/DDingUI.toc').read_text(encoding='utf-8')
          assert toc.index('Modules\\GroupSystem\\CDMFrameRegistry.lua') < toc.index('Modules\\GroupSystem\\FrameController.lua')
          print('hot-path boundaries: ok')
          PY
          git diff --check origin/agent/aura-style-migration...HEAD

      - name: Registry freshness mock
        run: |
          cat > /tmp/registry_freshness.lua <<'LUA'
          InCombatLockdown = function() return false end
          issecretvalue = function() return false end

          local function Viewer(name)
              return { _name = name, GetName = function(self) return self._name end }
          end
          local essential = Viewer('EssentialCooldownViewer')
          local utility = Viewer('UtilityCooldownViewer')
          local buffIcon = Viewer('BuffIconCooldownViewer')
          local buffBar = Viewer('BuffBarCooldownViewer')
          EssentialCooldownViewer = essential
          UtilityCooldownViewer = utility
          BuffIconCooldownViewer = buffIcon
          BuffBarCooldownViewer = buffBar

          local function Frame(parent, id)
              return { _parent = parent, cooldownID = id, GetParent = function(self) return self._parent end }
          end
          local fEssential = Frame(essential, 101)
          local fBuffOld = Frame(buffIcon, 202)
          local fBar = Frame(buffBar, 202)

          local compat = {}
          function compat:IsUsableID(id) return type(id) == 'number' and id > 0 and id == math.floor(id) end
          function compat:GetFrameCooldownID(frame) return frame.cooldownID end
          function compat:IsSettingsOpen() return false end

          local scanTime = 10
          local entries = {
              { cooldownID = 101, category = 'Essential', frame = fEssential },
              { cooldownID = 202, category = 'TrackedBuff+Bar', isTrackedBuff = true, isTrackedBar = true, iconFrame = fBuffOld, barFrame = fBar },
          }
          local scanner = {
              IsPopulated = function() return true end,
              GetAllEntries = function() return entries end,
              GetLastScanTime = function() return scanTime end,
          }
          local addon = { CDMCompat = compat, CDMScanner = scanner }
          assert(loadfile('DDingUI/Modules/GroupSystem/CDMFrameRegistry.lua'))('DDingUI', { Addon = addon })
          local R = assert(addon.GroupCDMFrameRegistry)

          assert(R:Bootstrap() == 3)
          assert(R:GetFrames('BuffIconCooldownViewer')[202] == fBuffOld)

          local fBuffNew = Frame(buffIcon, nil)
          assert(R:Acquire(buffIcon, fBuffNew))
          fBuffNew.cooldownID = 202
          assert(R:TrackFrame(fBuffNew, 202))
          assert(R:GetFrames('BuffIconCooldownViewer')[202] == fBuffNew)

          -- Same scanner snapshot cannot overwrite newer hook identity.
          assert(R:SyncFromScanner(false) == 0)
          assert(R:GetFrames('BuffIconCooldownViewer')[202] == fBuffNew)

          -- Release must remain released while scanner snapshot is unchanged.
          assert(R:ReleaseFrame(fBuffNew))
          assert(R:GetFrames('BuffIconCooldownViewer')[202] == nil)
          assert(R:SyncFromScanner(false) == 0)
          assert(R:GetFrames('BuffIconCooldownViewer')[202] == nil)

          -- A genuinely newer scanner snapshot may repair identity.
          scanTime = 11
          assert(R:SyncFromScanner(false) >= 1)
          assert(R:GetFrames('BuffIconCooldownViewer')[202] == fBuffOld)

          -- Frame reuse removes its previous viewer/id mapping.
          assert(R:Acquire(utility, fEssential))
          assert(R:GetFrames('EssentialCooldownViewer')[101] == nil)
          fEssential.cooldownID = 303
          assert(R:TrackFrame(fEssential, 303))
          assert(R:GetFrames('UtilityCooldownViewer')[303] == fEssential)

          -- Viewer replacement drops old-viewer identity rather than retaining it.
          local replacementUtility = Viewer('UtilityCooldownViewer')
          UtilityCooldownViewer = replacementUtility
          R:RegisterViewer('UtilityCooldownViewer', replacementUtility)
          assert(R:GetFrames('UtilityCooldownViewer')[303] == nil)

          local d = R:GetDiagnostics()
          assert(d.scannerRefreshes == 2)
          assert(d.scannerUnchangedSkips >= 2)
          assert(d.releases >= 1)
          assert(d.viewerResets >= 1)
          print('registry freshness mock: ok')
          LUA
          lua5.1 /tmp/registry_freshness.lua

      - name: Diff summary
        run: git diff --stat origin/agent/aura-style-migration...HEAD
